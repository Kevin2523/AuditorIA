<div class="flex flex-col h-full bg-transparent text-white font-display relative overflow-hidden">
  <!-- Header Bar Seamless (Integrated into UI) -->
  <div class="h-14 border-b border-white/10 flex items-center justify-between px-6 shrink-0 bg-black/20 backdrop-blur-md z-10">
    <div class="flex items-center gap-3">
      <div class="relative">
        <div class="w-8.5 h-8.5 rounded-full bg-emerald-500/20 border border-emerald-500/40 flex items-center justify-center text-emerald-400">
          <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 8V4H8"/><rect x="4" y="8" width="16" height="12" rx="2"/><path d="M2 14h2"/><path d="M20 14h2"/><path d="M15 13v2"/><path d="M9 13v2"/></svg>
        </div>
        <span class="absolute bottom-0 right-0 w-2 h-2 rounded-full bg-emerald-400 border border-slate-950"></span>
      </div>
      <div>
        <h2 class="text-sm font-bold text-white leading-tight">Asistente de Seguridad Integrado</h2>
        <p class="text-[11px] text-slate-300">Orientación para análisis, diagnóstico y remediación en tiempo real</p>
      </div>
    </div>

    <!-- Voice Control Toggle -->
    <button (click)="toggleVoiceEnabled()" [title]="isVoiceEnabled ? 'Desactivar voz del bot' : 'Activar voz del bot'" class="w-8 h-8 rounded-md flex items-center justify-center transition-colors cursor-pointer" [class.text-emerald-400]="isVoiceEnabled" [class.bg-white\/10]="isVoiceEnabled" [class.text-slate-400]="!isVoiceEnabled" [class.hover:bg-white\/10]="!isVoiceEnabled">
      <svg *ngIf="isVoiceEnabled" class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path></svg>
      <svg *ngIf="!isVoiceEnabled" class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><line x1="23" y1="9" x2="17" y2="15"></line><line x1="17" y1="9" x2="23" y2="15"></line></svg>
    </button>
  </div>

  <!-- Chat Scroll Area (Seamless Full Width) -->
  <div #scrollArea class="flex-1 min-h-0 overflow-y-auto p-5 lg:p-7 space-y-4 bg-transparent">
    <div *ngFor="let msg of messages" class="flex w-full" [class.justify-end]="msg.sender === 'user'">
      
      <!-- Assistant Message Bubble -->
      <div *ngIf="msg.sender === 'assistant'" class="flex max-w-[94%] lg:max-w-[85%] items-end gap-3">
        <div class="w-8 h-8 rounded-full bg-white/10 border border-white/20 flex items-center justify-center shrink-0 text-emerald-400 mb-1 backdrop-blur-md shadow-md">
          <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 8V4H8"/><rect x="4" y="8" width="16" height="12" rx="2"/><path d="M2 14h2"/><path d="M20 14h2"/><path d="M15 13v2"/><path d="M9 13v2"/></svg>
        </div>
        <div class="flex-1 min-w-0">
          <div class="text-[10px] font-mono text-slate-400 ml-1 mb-1">{{msg.time}}</div>

          <div *ngIf="msg.isTyping" class="bg-slate-900/80 border border-white/20 backdrop-blur-2xl rounded-lg py-3 px-4 text-slate-200 text-xs font-medium inline-block shadow-lg">
            {{msg.text}}
          </div>

          <div *ngIf="!msg.isTyping" class="bg-slate-900/80 border border-white/20 backdrop-blur-2xl rounded-lg py-3.5 px-4.5 text-white text-xs leading-relaxed chat-html shadow-xl" [innerHTML]="msg.html || msg.text">
          </div>
        </div>
      </div>

      <!-- User Message Bubble -->
      <div *ngIf="msg.sender === 'user'" class="flex max-w-[90%] lg:max-w-[80%] items-end gap-3 justify-end">
        <div>
          <div class="text-[10px] font-mono text-slate-400 text-right mr-1 mb-1">{{msg.time}}</div>
          <div class="bg-white text-slate-950 font-bold rounded-lg py-2.5 px-4 text-xs shadow-lg">
            {{msg.text}}
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Input Area (Integrated Glass Input Bar) -->
  <div class="bg-black/30 border-t border-white/10 p-4 shrink-0 space-y-2 backdrop-blur-xl">
    <!-- Input Box Bar -->
    <div class="flex items-end gap-2.5 mx-auto w-full max-w-5xl relative rounded-md border border-white/20 bg-white/10 focus-within:bg-white/15 focus-within:border-white/30 transition-all p-2 backdrop-blur-md shadow-lg">
      <button (click)="toggleVoice()" class="w-9 h-9 rounded-md flex items-center justify-center shrink-0 transition-colors cursor-pointer" [class.bg-red-500\/20]="isRecording" [class.text-red-400]="isRecording" [class.text-slate-300]="!isRecording" [class.hover:bg-white\/10]="!isRecording" title="Control por Voz Inteligente">
        <svg class="w-4.5 h-4.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 1a3 3 0 00-3 3v8a3 3 0 006 0V4a3 3 0 00-3-3z"/><path d="M19 10v2a7 7 0 01-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>
      </button>

      <textarea [(ngModel)]="userInput" (keydown)="handleKeyDown($event)" placeholder="Escribe tu consulta o activa el Control por Voz..." rows="1" class="flex-1 bg-transparent border-none focus:ring-0 py-2 px-1 text-xs text-white placeholder:text-slate-400 resize-none outline-none leading-normal"></textarea>

      <button (click)="sendMessage()" [disabled]="!userInput.trim() || isTyping" class="w-9 h-9 rounded-md flex items-center justify-center shrink-0 bg-white text-slate-950 hover:bg-slate-100 disabled:opacity-50 disabled:cursor-not-allowed transition-colors shadow-md cursor-pointer">
        <svg class="w-4 h-4 ml-0.5 text-slate-950" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
      </button>
    </div>

    <div *ngIf="isRecording" class="text-center text-xs font-bold text-red-400 animate-pulse">Escuchando comando de voz...</div>
  </div>
</div>
