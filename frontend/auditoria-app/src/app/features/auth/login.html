<main class="min-h-screen w-full relative flex items-center justify-center p-4 sm:p-6 md:p-8 bg-slate-950 overflow-hidden select-none">

  <!-- Fullscreen Background Image -->
  <div class="absolute inset-0 bg-cover bg-center bg-no-repeat transition-all duration-700 scale-[1.01]"
       style="background-image: url('/assets/login_bg.png'), url('/assets/login_bg.jpg');">
  </div>

  <!-- Subtle Vignette Overlay for Contrast & Atmosphere -->
  <div class="absolute inset-0 bg-gradient-to-t from-black/60 via-black/25 to-black/40 pointer-events-none"></div>

  <!-- Central Executive Login Card (Squared Corners & Super Translucent Glass) -->
  <section class="relative z-10 w-full max-w-[390px] md:max-w-[420px] rounded-lg bg-black/30 backdrop-blur-2xl p-7 md:p-9 shadow-[0_30px_90px_rgba(0,0,0,0.6)] border border-white/15 text-white">
    
    <!-- Branding Header -->
    <div class="text-center mb-7">
      <h1 class="font-['Playfair_Display','Times_New_Roman',serif] text-3xl md:text-4xl font-bold tracking-tight text-white leading-tight drop-shadow-sm">
        AuditorIA
      </h1>
      <p class="text-[10px] md:text-[11px] font-semibold text-slate-300 tracking-[0.3em] uppercase mt-1 opacity-90">
        EXECUTIVE STUDIO
      </p>
    </div>

    <!-- Alert Error Message -->
    @if (error()) {
      <div class="mb-5 rounded-md border border-red-500/40 bg-red-950/50 backdrop-blur-md px-3.5 py-2.5 text-xs font-medium text-red-200 flex items-center gap-2">
        <svg class="w-4 h-4 text-red-400 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
        </svg>
        <span>{{ error() }}</span>
      </div>
    }

    <!-- Alert Info Message -->
    @if (info()) {
      <div class="mb-5 rounded-md border border-cyan-500/40 bg-cyan-950/50 backdrop-blur-md px-3.5 py-2.5 text-xs font-medium text-cyan-200 flex items-center gap-2">
        <svg class="w-4 h-4 text-cyan-400 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/>
        </svg>
        <span>{{ info() }}</span>
      </div>
    }

    <!-- Login Form -->
    <form class="space-y-4 md:space-y-5" [formGroup]="form" (ngSubmit)="submit()">

      @if (!mfaMode()) {
        <!-- Corporate ID / Email Field -->
        <div>
          <label class="block text-[11px] font-bold text-slate-300 tracking-wider uppercase mb-1.5">
            Corporate ID
          </label>
          <div class="relative flex items-center rounded-md bg-white/10 hover:bg-white/15 focus-within:bg-white/20 border border-white/15 transition-all focus-within:ring-2 focus-within:ring-white/30 backdrop-blur-md">
            <svg class="w-4 h-4 text-slate-300 absolute left-3.5 pointer-events-none" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
              <circle cx="12" cy="7" r="4"/>
            </svg>
            <input
              type="email"
              formControlName="email"
              autocomplete="email"
              placeholder="executive@auditoria.ai"
              class="w-full h-11 pl-10 pr-3 bg-transparent border-0 text-white placeholder:text-slate-400 text-sm font-medium focus:outline-none focus:ring-0"
            />
          </div>
        </div>

        <!-- Passcode Field -->
        <div>
          <div class="flex items-center justify-between mb-1.5">
            <label class="block text-[11px] font-bold text-slate-300 tracking-wider uppercase">
              Passcode
            </label>
            <a routerLink="/forgot-password" class="text-[11px] font-semibold text-slate-300 hover:text-white transition-colors">
              Reset
            </a>
          </div>
          <div class="relative flex items-center rounded-md bg-white/10 hover:bg-white/15 focus-within:bg-white/20 border border-white/15 transition-all focus-within:ring-2 focus-within:ring-white/30 backdrop-blur-md">
            <svg class="w-4 h-4 text-slate-300 absolute left-3.5 pointer-events-none" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
            </svg>
            <input
              type="password"
              formControlName="password"
              autocomplete="current-password"
              placeholder="••••••••••••"
              class="w-full h-11 pl-10 pr-3 bg-transparent border-0 text-white placeholder:text-slate-400 text-sm font-medium focus:outline-none focus:ring-0"
            />
          </div>
        </div>

      } @else {

        <!-- MFA Mode Controls -->
        @if (hasMfaTotp()) {
          <div>
            <label class="block text-[11px] font-bold text-slate-300 tracking-wider uppercase mb-1.5 text-center">
              Código OTP (6 dígitos)
            </label>
            <div class="relative flex items-center rounded-md bg-white/10 hover:bg-white/15 focus-within:bg-white/20 border border-white/15 transition-all focus-within:ring-2 focus-within:ring-white/30 backdrop-blur-md">
              <input
                type="text"
                formControlName="otp"
                inputmode="numeric"
                maxlength="6"
                autocomplete="one-time-code"
                placeholder="123456"
                class="w-full h-11 px-3 bg-transparent border-0 text-white tracking-[0.35em] text-center font-mono text-base font-bold focus:outline-none focus:ring-0"
              />
            </div>
          </div>
        }

        @if (hasMfaTotp() && hasPasskeys()) {
          <div class="flex items-center gap-3 text-xs text-slate-400 my-2">
            <span class="flex-1 h-px bg-white/15"></span>
            <span class="font-medium">o</span>
            <span class="flex-1 h-px bg-white/15"></span>
          </div>
        }

        @if (hasPasskeys()) {
          <button
            type="button"
            (click)="passkeyMfaLogin()"
            [disabled]="passkeyLoading()"
            class="w-full h-11 rounded-md border border-white/20 bg-white/10 hover:bg-white/20 text-white text-sm font-bold transition-colors disabled:opacity-60 flex items-center justify-center gap-2 shadow-sm cursor-pointer"
          >
            <svg class="w-4 h-4 text-slate-200" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="11" width="18" height="11" rx="2"/>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
            </svg>
            {{ passkeyLoading() ? 'Verificando...' : 'Face ID / Passkey' }}
          </button>
        }

        <button type="button" (click)="backToCredentials()" class="block text-center text-xs font-semibold text-slate-300 hover:text-white transition-colors pt-1">
          ← Volver a credenciales
        </button>
      }

      <!-- Submit Button -->
      @if (!mfaMode() || hasMfaTotp()) {
        <button
          type="submit"
          [disabled]="loading()"
          class="w-full h-11 rounded-md bg-white hover:bg-slate-100 text-slate-950 text-sm font-bold transition-all shadow-lg hover:shadow-xl disabled:opacity-60 disabled:cursor-not-allowed flex items-center justify-center gap-2 group cursor-pointer mt-6"
        >
          @if (loading()) {
            <span>Validando...</span>
          } @else {
            <span>{{ mfaMode() ? 'Verificar OTP' : 'Authorize' }}</span>
            <svg class="w-4 h-4 transition-transform group-hover:translate-x-0.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M5 12h14M12 5l7 7-7 7"/>
            </svg>
          }
        </button>
      }

    </form>

    <!-- Secure Access Footer Badge -->
    <div class="mt-7 md:mt-8 pt-1 flex items-center justify-center gap-1.5 text-[11px] font-medium text-slate-400 select-none opacity-80">
      <svg class="w-3.5 h-3.5 text-slate-300" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
        <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
      </svg>
      <span>Secure Access</span>
    </div>

  </section>
</main>
