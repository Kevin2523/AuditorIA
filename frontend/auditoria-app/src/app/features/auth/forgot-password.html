<main class="min-h-screen w-full relative flex items-center justify-center p-4 sm:p-6 md:p-8 bg-slate-950 overflow-hidden select-none">

  <!-- Fullscreen Background Image -->
  <div class="absolute inset-0 bg-cover bg-center bg-no-repeat transition-all duration-700 scale-[1.01]"
       style="background-image: url('/assets/login_bg.png'), url('/assets/login_bg.jpg');">
  </div>

  <!-- Subtle Vignette Overlay -->
  <div class="absolute inset-0 bg-gradient-to-t from-black/60 via-black/25 to-black/40 pointer-events-none"></div>

  <!-- Central Executive Glass Card -->
  <section class="relative z-10 w-full max-w-[390px] md:max-w-[420px] rounded-lg bg-black/30 backdrop-blur-2xl p-7 md:p-9 shadow-[0_30px_90px_rgba(0,0,0,0.6)] border border-white/15 text-white">
    
    <!-- Branding Header -->
    <div class="text-center mb-6">
      <h1 class="font-['Playfair_Display','Times_New_Roman',serif] text-3xl font-bold tracking-tight text-white leading-tight">
        AuditorIA
      </h1>
      <p class="text-[10px] font-semibold text-slate-300 tracking-[0.3em] uppercase mt-1">
        RECUPERACIÓN DE ACCESO
      </p>
    </div>

    <p class="text-xs text-slate-300 text-center mb-6 leading-relaxed">
      Ingresa tu correo asignado para enviar las instrucciones de recuperación.
    </p>

    @if (error()) {
      <div class="mb-4 rounded-md border border-red-500/40 bg-red-950/50 backdrop-blur-md px-3.5 py-2.5 text-xs font-medium text-red-200 flex items-center gap-2">
        <span>{{ error() }}</span>
      </div>
    }
    @if (info()) {
      <div class="mb-4 rounded-md border border-emerald-500/40 bg-emerald-950/50 backdrop-blur-md px-3.5 py-2.5 text-xs font-medium text-emerald-200 flex items-center gap-2">
        <span>{{ info() }}</span>
      </div>
    }

    <form class="space-y-4" [formGroup]="form" (ngSubmit)="submit()">
      <div>
        <label class="block text-[11px] font-bold text-slate-300 tracking-wider uppercase mb-1.5">
          Corporate ID / Correo
        </label>
        <div class="relative flex items-center rounded-md bg-white/10 hover:bg-white/15 focus-within:bg-white/20 border border-white/15 transition-all focus-within:ring-2 focus-within:ring-white/30 backdrop-blur-md">
          <svg class="w-4 h-4 text-slate-300 absolute left-3.5 pointer-events-none" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
            <circle cx="12" cy="7" r="4"/>
          </svg>
          <input
            type="email"
            formControlName="email"
            placeholder="executive@auditoria.ai"
            class="w-full h-11 pl-10 pr-3 bg-transparent border-0 text-white placeholder:text-slate-400 text-sm font-medium focus:outline-none focus:ring-0"
          />
        </div>
      </div>

      <button type="submit" [disabled]="loading()" class="w-full h-11 rounded-md bg-white hover:bg-slate-100 text-slate-950 text-sm font-bold transition-all shadow-lg disabled:opacity-60 cursor-pointer mt-4">
        {{ loading() ? 'Enviando...' : 'Enviar enlace' }}
      </button>

      <a routerLink="/login" class="block text-center text-xs font-semibold text-slate-300 hover:text-white transition-colors pt-2">
        ← Volver a iniciar sesión
      </a>
    </form>
  </section>
</main>
