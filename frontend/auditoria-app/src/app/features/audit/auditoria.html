<div class="bg-black/20 backdrop-blur-lg border border-white/15 rounded-lg p-5 lg:p-6 mb-6 text-white shadow-2xl">
  <div class="flex items-center justify-between mb-5">
    <div class="flex items-center gap-3">
      <div class="relative flex h-3 w-3">
        <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
        <span class="relative inline-flex rounded-full h-3 w-3 bg-emerald-400"></span>
      </div>
      <h3 class="font-['Playfair_Display','Times_New_Roman',serif] text-sm md:text-base font-bold text-white uppercase tracking-wider">Centro de Auditoría - Live Feed</h3>
    </div>
  </div>

  <div class="overflow-x-auto">
    <table class="w-full text-left border-collapse">
      <thead>
        <tr class="border-b border-white/10">
          <th class="py-2.5 px-3 text-[11px] font-bold text-slate-300 uppercase tracking-wider">Hora</th>
          <th class="py-2.5 px-3 text-[11px] font-bold text-slate-300 uppercase tracking-wider">Host</th>
          <th class="py-2.5 px-3 text-[11px] font-bold text-slate-300 uppercase tracking-wider">Análisis de IA</th>
        </tr>
      </thead>
      <tbody class="divide-y divide-white/5">
        <tr *ngFor="let alert of alerts.alerts()" class="hover:bg-white/10 transition-colors">
          <td class="py-2.5 px-3 text-xs font-mono text-slate-300 whitespace-nowrap">{{ formatDate(alert.receivedAt) }}</td>
          <td class="py-2.5 px-3 text-xs font-bold text-white whitespace-nowrap">{{ hostName(alert.hostname, alert.deviceId) }}</td>
          <td class="py-2.5 px-3 text-xs">
            <div class="flex items-start gap-2">
              <div class="w-2 h-2 rounded-full mt-1 shrink-0"
                   [class]="alert.severity === 'critical' ? 'bg-red-400 shadow-[0_0_8px_rgba(248,113,113,0.8)]' : 'bg-emerald-400'">
              </div>
              <span [class]="alert.severity === 'critical' ? 'text-red-300 font-bold' : 'text-slate-200 font-medium'">
                {{ alert.message }}
              </span>
            </div>
          </td>
        </tr>
        <tr *ngIf="alerts.alerts().length === 0">
          <td colspan="3" class="py-8 text-center text-xs text-slate-400 font-medium">
            Esperando transmisión de datos...
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
