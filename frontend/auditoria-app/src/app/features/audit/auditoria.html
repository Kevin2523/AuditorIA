<div class="bg-[#0a0a0a]/80 backdrop-blur-xl border border-white/15 rounded-xl p-5 lg:p-6 mb-6 text-white shadow-2xl transition-all">
  
  <!-- Header Bar -->
  <div class="flex items-center justify-between mb-4 pb-3 border-b border-white/10">
    <div class="flex items-center gap-3">
      <!-- Soft Pulsing Green Dot -->
      <div class="relative flex h-3 w-3 items-center justify-center">
        <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
        <span class="relative inline-flex rounded-full h-2.5 w-2.5 bg-emerald-400 shadow-[0_0_8px_rgba(52,211,153,0.8)]"></span>
      </div>
      <h3 class="font-['Playfair_Display','Times_New_Roman',serif] text-sm md:text-base font-bold text-white uppercase tracking-wider">
        Centro de Auditoría - Live Feed
      </h3>
    </div>

    <!-- Live Polling Badge / Status -->
    <div class="flex items-center gap-2">
      <span class="text-[10px] font-mono text-slate-400 bg-white/5 border border-white/10 px-2.5 py-1 rounded-md">
        Polling 30s
      </span>
    </div>
  </div>

  <!-- Content Container with Vertical Scroll (max-height ~300px) -->
  <div class="max-h-[300px] overflow-y-auto custom-scrollbar pr-1">

    <!-- DESKTOP VIEW: Table format (md:table) -->
    <div class="hidden md:block">
      <table class="w-full text-left border-collapse">
        <thead class="sticky top-0 bg-[#0a0a0a] z-10 shadow-sm">
          <tr class="border-b border-white/10 text-[11px] font-bold text-slate-400 uppercase tracking-wider">
            <th class="py-2.5 px-4 w-28">Hora</th>
            <th class="py-2.5 px-4 w-44">Host</th>
            <th class="py-2.5 px-4">Análisis de IA</th>
          </tr>
        </thead>
        <tbody class="divide-y divide-white/5">
          <tr
            *ngFor="let alert of alerts.alerts()"
            class="animate-fadeIn even:bg-white/[0.02] hover:bg-white/[0.06] transition-colors group cursor-default"
            [class]="getSeverityBorderClass(alert)"
          >
            <!-- HORA -->
            <td class="py-3 px-4 text-xs font-mono font-bold text-slate-300 whitespace-nowrap">
              {{ formatTime(alert) }}
            </td>

            <!-- HOST -->
            <td class="py-3 px-4 text-xs font-bold text-white whitespace-nowrap">
              <div class="flex items-center gap-2">
                <span class="w-2 h-2 rounded-full shrink-0" [class]="getSeverityDotClass(alert)"></span>
                <span class="font-mono">{{ getHost(alert) }}</span>
              </div>
            </td>

            <!-- ANÁLISIS DE IA -->
            <td class="py-3 px-4 text-xs leading-relaxed">
              <span [class]="getSeverity(alert) === 'critical' ? 'text-red-300 font-semibold' : getSeverity(alert) === 'high' ? 'text-orange-300 font-semibold' : 'text-slate-200 font-normal'">
                {{ getMessage(alert) }}
              </span>
            </td>
          </tr>

          <!-- EMPTY STATE -->
          <tr *ngIf="alerts.alerts().length === 0">
            <td colspan="3" class="py-12 text-center text-xs text-slate-400 font-medium">
              <div class="flex flex-col items-center justify-center gap-2">
                <svg class="w-6 h-6 text-slate-500 animate-pulse" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
                <span>Esperando transmisión de datos...</span>
              </div>
            </td>
          </tr>
        </tbody>
      </table>
    </div>

    <!-- MOBILE VIEW: Vertical Stack of Cards (block md:hidden) -->
    <div class="block md:hidden space-y-3">
      <div
        *ngFor="let alert of alerts.alerts()"
        class="animate-fadeIn p-3.5 rounded-lg bg-white/[0.03] hover:bg-white/[0.07] border border-white/10 transition-all space-y-2"
        [class]="getSeverityBorderClass(alert)"
      >
        <!-- Header of Card: Host & Time -->
        <div class="flex items-center justify-between text-xs border-b border-white/5 pb-2">
          <div class="flex items-center gap-2 font-bold text-white font-mono">
            <span class="w-2 h-2 rounded-full shrink-0" [class]="getSeverityDotClass(alert)"></span>
            <span>{{ getHost(alert) }}</span>
          </div>
          <span class="font-mono text-[11px] text-slate-400 font-bold bg-white/5 px-2 py-0.5 rounded">
            {{ formatTime(alert) }}
          </span>
        </div>

        <!-- AI Analysis Message -->
        <p class="text-xs leading-relaxed" [class]="getSeverity(alert) === 'critical' ? 'text-red-300 font-semibold' : getSeverity(alert) === 'high' ? 'text-orange-300 font-semibold' : 'text-slate-200 font-normal'">
          {{ getMessage(alert) }}
        </p>
      </div>

      <!-- MOBILE EMPTY STATE -->
      <div *ngIf="alerts.alerts().length === 0" class="py-10 text-center text-xs text-slate-400 font-medium">
        <div class="flex flex-col items-center justify-center gap-2">
          <svg class="w-6 h-6 text-slate-500 animate-pulse" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
          <span>Esperando transmisión de datos...</span>
        </div>
      </div>
    </div>

  </div>
</div>
